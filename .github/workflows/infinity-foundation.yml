name: Infinity Crafting Foundation

# Automatic execution is intentionally disabled at this checkpoint.
# The first GitHub-hosted runs failed before any job step was recorded
# (runs 35544275090 and 35544275575). Treat this as CI infrastructure/policy
# blocked, not as compilation evidence. Codex should first run the documented
# local commands, then diagnose/reenable CI separately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-compile:
    name: Baseline compile (Java 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited SWGAide baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7f520ee508221cce3ac3e8871919e74de9fcb0c2
          persist-credentials: false
      - name: Set up Java 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "8"
      - name: Record environment
        run: |
          java -version
          mvn -version
          git rev-parse HEAD
      - name: Compile audited baseline
        run: mvn -B -Dstyle.color=never test-compile

  foundation-compile-and-self-test:
    name: Foundation compile and self-test (Java 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Java 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "8"
      - name: Record environment and candidate SHA
        run: |
          java -version
          mvn -version
          git rev-parse HEAD
          git status --short
      - name: Compile candidate and self-tests
        run: mvn -B -Dstyle.color=never test-compile
      - name: Run Infinity foundation self-tests
        run: java -ea -cp target/test-classes:target/classes swg.infinity.FoundationSelfTestSuite
